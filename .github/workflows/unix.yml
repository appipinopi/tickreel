name: macOS and Linux release builds
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach preview packages to (empty = artifacts only)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev libxrandr-dev libxss-dev libgbm-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libxcb-randr0-dev xvfb fonts-noto-cjk
      - name: Test
        run: cargo test --locked
      - name: Install bundled FFmpeg
        run: npm install --no-save --package-lock=false ffmpeg-static@5.3.0
      - name: Package
        run: bash scripts/build-unix.sh
      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a ./target/release/tickreel-rust --ui-test-update
      - uses: actions/upload-artifact@v4
        with:
          name: Tickreel-${{ matrix.platform }}
          path: |
            dist/Tickreel-*.zip
            dist/Tickreel-*.tar.gz
      - name: Attach packages to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG"
          for file in dist/Tickreel-*.zip dist/Tickreel-*.tar.gz; do
            [ -e "$file" ] || continue
            gh release upload "$RELEASE_TAG" "$file"
          done

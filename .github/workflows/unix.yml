name: macOS and Linux release builds
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach preview packages to (empty = artifacts only)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev libxrandr-dev libxss-dev libgbm-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libxcb-randr0-dev xvfb fonts-noto-cjk rpm dpkg-dev
      - name: Wayland integration test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y sway pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr dbus-x11 meson ninja-build libinih-dev libsystemd-dev libwayland-dev wayland-protocols libdrm-dev
          # Ubuntu 24.04's xdpw 0.7 rejects software-only headless outputs.
          # Use the same 0.8.1 backend as the local integration test, pinned to
          # its upstream release commit. This changes the test fixture only.
          git clone https://github.com/emersion/xdg-desktop-portal-wlr.git "$RUNNER_TEMP/tickreel-xdpw"
          git -C "$RUNNER_TEMP/tickreel-xdpw" checkout 083aed357d5c8166aed132a76796de6847605289
          # Upstream 0.8.1 omits unistd.h in one source; newer system headers
          # no longer include it transitively. Supply its standard declaration.
          CFLAGS='-include unistd.h' meson setup "$RUNNER_TEMP/tickreel-xdpw/build" "$RUNNER_TEMP/tickreel-xdpw" -Dman-pages=disabled -Dsystemd=disabled
          ninja -C "$RUNNER_TEMP/tickreel-xdpw/build"
          sudo install -m755 "$RUNNER_TEMP/tickreel-xdpw/build/xdg-desktop-portal-wlr" /usr/libexec/xdg-desktop-portal-wlr
      - name: Test
        run: cargo test --locked
      - name: Install bundled FFmpeg
        run: npm install --no-save --package-lock=false ffmpeg-static@5.3.0
      - name: Package
        run: bash scripts/build-unix.sh
      - name: Wayland Portal and PipeWire integration test
        if: runner.os == 'Linux'
        run: |
          sudo bash scripts/test-wayland.sh ./target/release/tickreel-rust
      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a ./target/release/tickreel-rust --ui-test-update
      - uses: actions/upload-artifact@v4
        with:
          name: Tickreel-${{ matrix.platform }}
          path: |
            dist/Tickreel-*.zip
            dist/Tickreel-*.tar.gz
            dist/Tickreel-*.deb
            dist/Tickreel-*.rpm
      - name: Attach packages to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG"
          for file in dist/Tickreel-*.zip dist/Tickreel-*.tar.gz dist/Tickreel-*.deb dist/Tickreel-*.rpm; do
            [ -e "$file" ] || continue
            if gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | index("'"$(basename "$file")"'") != null' | grep -q true; then
              echo "Preserving existing asset: $(basename "$file")"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$file"
          done

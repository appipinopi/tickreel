name: Snap package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with:
          name: Tickreel-snap-amd64
          path: ${{ steps.snapcraft.outputs.snap }}

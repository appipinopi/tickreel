name: Verify published Windows ARM64 installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install and exercise published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-windows-release.py

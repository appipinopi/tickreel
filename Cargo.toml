[package]
name = "tickreel-rust"
version = "1.0.0"
edition = "2024"
description = "Local desktop work timelapse recorder"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
base64 = "0.22"
tao = "0.34"
wry = "0.53"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
fs2 = "0.4"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_Security"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"

[profile.release]
opt-level = 2
strip = true


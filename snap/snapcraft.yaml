name: tickreel
title: Tickreel
version: '1.0.0'
summary: Turn your daily desktop work into a timelapse
description: |
  Record your drawing or development workflow locally, then create a timelapse
  with visual captions, your own voice narration, music and work statistics.
  Supports multiple monitors and weekly/monthly compilations.
  This initial Linux version supports X11 sessions. Wayland capture is not supported.
  Microphone recording requires connecting the audio-record interface.
base: core24
grade: devel
confinement: strict
platforms:
  amd64:
apps:
  tickreel:
    command: bin/tickreel-rust
    extensions: [gnome]
    desktop: usr/share/applications/tickreel.desktop
    plugs: [x11, audio-playback, audio-record, network, home, screen-inhibit-control]
    environment:
      TICKREEL_FFMPEG: $SNAP/bin/ffmpeg
parts:
  tickreel:
    plugin: dump
    source: https://github.com/appipinopi/tickreel/releases/download/v1.0.0/Tickreel-1.0.0-linux-x86_64.tar.gz
    source-checksum: sha256/0d840ff9940cf96782aef3e3c13c332d82f1239480d4466f0ec1b4b7c1fd52fb
    override-build: |
      binary="$(find "$CRAFT_PART_SRC" -type f -name tickreel -print -quit)"
      test -n "$binary"
      package_dir="$(dirname "$binary")"
      install -Dm755 "$binary" "$CRAFT_PART_INSTALL/bin/tickreel-rust"
      install -Dm755 "$package_dir/ffmpeg" "$CRAFT_PART_INSTALL/bin/ffmpeg"
      mkdir -p "$CRAFT_PART_INSTALL/share/doc/tickreel"
      cp -r "$package_dir/licenses" "$CRAFT_PART_INSTALL/share/doc/tickreel/"
    stage-packages:
      - libasound2t64
      - libxdo3
      - libxss1
      - libpipewire-0.3-0t64
      - fonts-noto-cjk
  desktop:
    plugin: dump
    source: snap/gui
    organize:
      tickreel.desktop: usr/share/applications/tickreel.desktop
      tickreel.svg: usr/share/icons/hicolor/scalable/apps/tickreel.svg

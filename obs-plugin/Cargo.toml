[package]
name = "tickreel-obs"
version = "1.0.2"
edition = "2024"
license = "GPL-2.0-or-later"
description = "OBS Studio timelapse recorder for Tickreel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app-signature = { git = "https://github.com/appipinopi/app-signature", rev = "3e1017ce51e848479eb76f8acd7c8a186f810593" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 2
strip = true
